[workspace]
resolver = "3"
members = [
    "crates/edvige-core",
    "crates/edvige-storage",
    "crates/edvige-imap",
    "crates/edvige-smtp",
    "crates/edvige-proto",
    "crates/edvige-daemon",
    "crates/edvige-gui",
]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
edvige-core = { path = "crates/edvige-core" }
edvige-daemon = { path = "crates/edvige-daemon" }
edvige-gui = { path = "crates/edvige-gui" }
edvige-imap = { path = "crates/edvige-imap" }
edvige-proto = { path = "crates/edvige-proto" }
edvige-smtp = { path = "crates/edvige-smtp" }
edvige-storage = { path = "crates/edvige-storage" }
eframe = "0.29"
egui = "0.29"
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ksni = { version = "0.3", features = ["blocking"] }
mail-parser = "0.9"
nom = "8.0"
notify-rust = "4.11"
open = "5.3"
prost = "0.13"
rfd = "0.15"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
tempfile = "3.17"
thiserror = "2"
tokio = { version = "1.50", features = ["full"] }
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.12"
tonic-build = "0.12"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.13", features = ["v4", "v7", "serde"] }
webpki-roots = "1"
