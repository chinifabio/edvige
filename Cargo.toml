[workspace]
resolver = "3"
members = [
    "crates/edvige-core",
    "crates/edvige-storage",
    "crates/edvige-imap",
]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
edvige-core = { path = "crates/edvige-core" }
edvige-storage = { path = "crates/edvige-storage" }
nom = "8.0"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
tempfile = "3.17"
thiserror = "2"
tokio = { version = "1.50", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.13", features = ["v4", "v7", "serde"] }
webpki-roots = "1"
